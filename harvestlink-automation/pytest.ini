[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --browser chromium
    --headed
    --html=reports/html/login_test_report.html
    --self-contained-html
    -s
    --no-header
    -W ignore
    --tb=short
markers =
    login: HarvestLink login automation tests
    farmer: Farmer role login tests
    buyer: Buyer role login tests
    stakeholder: Stakeholder role login tests
    admin: Admin role login tests
    negative: Invalid login negative tests
log_cli = false
